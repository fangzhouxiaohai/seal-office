name: 结束本次卡住的苹果验收任务
on:
  push:
    branches: ['codex/markdown-update-272']
    paths: ['.github/workflows/cancel-stalled-macos.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 结束本次旧版无超时验收
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 43480529508 43479390473 43481238558; do
            status=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/fangzhouxiaohai/seal-office/actions/runs/$run" | jq -r '.status')
            if [ "$status" = completed ]; then
              echo "任务 $run 已结束，无需停止"
              continue
            fi
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -X POST --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/fangzhouxiaohai/seal-office/actions/runs/$run/cancel")
            if [ "$code" != 202 ]; then
              echo "任务 $run 未接受停止请求，状态码 $code"
              exit 1
            fi
            echo "已请求停止本次验收任务 $run"
          done
