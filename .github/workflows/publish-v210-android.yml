name: Publish verified Android 2.1 assets
on:
  push:
    branches: [codex/publish-v210-android-20261021]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify public mirror and upload identical signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import http.client
          import json
          import os
          from pathlib import Path
          import re
          import tempfile
          import urllib.parse
          import urllib.request
          
          TOKEN = os.environ['GH_TOKEN']
          API = 'https://api.github.com/repos/fangzhouxiaohai/seal-office'
          RELEASE_ID = 418704622
          PLAN = json.loads('{"version": "2.1.0", "tag": "v2.1.0-android", "commit": "73736dcb5369f903958ef1de54b1adff8ef6119f", "assets": [{"name": "seal-office-2.1.0-android.apk", "bytes": 89484019, "sha256": "bdea125a7ab15af89aee23d4de0d798ea001f3610025307b9bdf5022306e4c9f"}, {"name": "seal-office-2.1.0-android-verification.json", "bytes": 10260, "sha256": "283be030a909f97c905dbf3e4f72232715e839707e80f5ffae8b3a6a0fda1aab"}, {"name": "seal-office-2.1.0-android-SHA256SUMS.txt", "bytes": 208, "sha256": "c0c33f7bfe5a6533e7f40f150a6fd5b4b7a8d7d354370353503529fd862fa0dc"}]}')
          
          def emit(**row):
              print(json.dumps(row), flush=True)
          
          def api(endpoint):
              request = urllib.request.Request(API + endpoint, headers={'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'SealOffice-verified-release'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          
          def checked(remote, local):
              assert remote['name'] == local['name'] and remote['size'] == local['bytes']
              assert remote.get('digest') == 'sha256:' + local['sha256'] and remote['state'] == 'uploaded', 'Existing draft asset is incomplete or has a different digest: ' + local['name']
          
          assert api('/git/ref/tags/v2.1.0-android')['object']['sha'] == PLAN['commit']
          # The immutable Android tag identifies the compiled native release source.
          release = api('/releases/' + str(RELEASE_ID))
          assert release['draft'] and release['tag_name'] == PLAN['tag']
          upload = urllib.parse.urlsplit(release['upload_url'].split('{', 1)[0])
          assert upload.scheme == 'https' and upload.hostname == 'uploads.github.com'
          current = {a['name']: a for a in api('/releases/' + str(RELEASE_ID) + '/assets?per_page=100')}
          expected = {a['name']: a for a in PLAN['assets']}
          assert set(current) <= set(expected)
          for name, row in current.items():
              checked(row, expected[name])
          
          def publish(row, directory):
              name = row['name']
              assert re.fullmatch(r'[A-Za-z0-9._-]+', name)
              if name in current:
                  emit(phase='already-verified', name=name)
                  return
              source = 'https://api.gitcode.com/api/v5/repos/gcw_pGfMiWVg/seal-office/releases/v2.1.0-android/attach_files/' + name + '/download'
              file = directory / name
              digest, size = hashlib.sha256(), 0
              try:
                  request = urllib.request.Request(source, headers={'User-Agent': 'SealOffice-verified-release'})
                  with urllib.request.urlopen(request, timeout=120) as response, file.open('xb') as output:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
                          digest.update(chunk)
                          size += len(chunk)
              except Exception as error:
                  raise RuntimeError('Public mirror download failed for ' + name + ': ' + type(error).__name__) from None
              assert size == row['bytes'] and digest.hexdigest() == row['sha256'], 'Mirror bytes differ: ' + name
              emit(phase='download-verified', name=name, bytes=size, sha256=digest.hexdigest())
              connection = http.client.HTTPSConnection(upload.hostname, timeout=300)
              try:
                  path = upload.path + '?' + urllib.parse.urlencode({'name': name})
                  connection.putrequest('POST', path)
                  for key, value in {'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json',
                                     'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'SealOffice-verified-release',
                                     'Content-Type': 'application/octet-stream', 'Content-Length': str(size)}.items():
                      connection.putheader(key, value)
                  connection.endheaders()
                  with file.open('rb') as stream:
                      while chunk := stream.read(1024 * 1024):
                          connection.send(chunk)
                  response = connection.getresponse()
                  assert response.status == 201, 'GitHub upload HTTP ' + str(response.status) + ': ' + name
                  remote = json.loads(response.read())
                  checked(remote, row)
              finally:
                  connection.close()
              file.unlink()
              emit(phase='upload-verified', name=name, bytes=size, sha256=row['sha256'])
          
          with tempfile.TemporaryDirectory(prefix='seal-office-release-') as temporary:
              directory = Path(temporary)
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  list(pool.map(lambda row: publish(row, directory), sorted(PLAN['assets'], key=lambda r: -r['bytes'])))
          assets = api('/releases/' + str(RELEASE_ID) + '/assets?per_page=100')
          assert {a['name'] for a in assets} == set(expected)
          for row in assets:
              checked(row, expected[row['name']])
          emit(phase='all-assets-verified', assets=len(assets), draftRemainsPrivate=True, commit=PLAN['commit'])
          PY
