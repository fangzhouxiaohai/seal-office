name: Ubuntu desktop package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu.yml'
      - 'build/electron-ubuntu.cjs'
      - 'main/linux/**'
      - 'main/office/native*.js'
      - 'scripts/verify-ubuntu-release.cjs'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify platform integration
        run: npx vitest run --config vitest.main.config.js main/linux/platform.test.js main/fileAssociation.test.js main/windows/defaultApps.test.js main/main.test.js main/integrity.test.js
      - name: Build Ubuntu amd64 package
        run: npm run dist:ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: release/ubuntu/*.deb
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: release/ubuntu
      - name: Install package and offline conversion dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./release/ubuntu/*.deb xvfb desktop-file-utils
          desktop-file-validate /usr/share/applications/sealoffice.desktop
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' seal-office libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Verify installed application, files and rendering
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' node scripts/verify-ubuntu-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: release/ubuntu/verification/*
          if-no-files-found: error
