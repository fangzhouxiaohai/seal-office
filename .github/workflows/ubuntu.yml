name: Ubuntu desktop package
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/ubuntu.yml'
      - 'build/electron-ubuntu.cjs'
      - 'build/artifact-names.json'
      - 'scripts/artifact-names.cjs'
      - 'main/linux/**'
      - 'main/office/native*.js'
      - 'main/office/xlsx*.js'
      - 'renderer/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-ubuntu-release.cjs'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current release directory
        run: node -e "const fs=require('fs'),v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_DIR=release/v'+v+'\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify platform integration
        run: npx vitest run --config vitest.main.config.js main/linux/platform.test.js main/fileAssociation.test.js main/windows/defaultApps.test.js main/main.test.js main/integrity.test.js main/office/xlsxNamespaces.test.js main/office/xlsxCodec.test.js
      - name: Build Ubuntu amd64 package
        # Release upload happens separately after both installed-package checks.
        run: npm run dist:ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: ${{ env.RELEASE_DIR }}/*.deb
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current release directory
        run: node -e "const fs=require('fs'),v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_DIR=release/v'+v+'\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: ${{ env.RELEASE_DIR }}
      - name: Install package and offline conversion dependencies
        run: |
          # The runner's Azure mirror can throttle large LibreOffice downloads
          # below 100 KiB/s. Keep Ubuntu's signing keys and suites, changing only
          # that mirror to the official archive; support both source formats.
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for source in sources:
              if source.is_file():
                  before = source.read_text()
                  after = before.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if after != before:
                      source.write_text(after)
          PY
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y "./$RELEASE_DIR"/*.deb xvfb desktop-file-utils libglib2.0-bin
          desktop-file-validate /usr/share/applications/sealoffice.desktop
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' seal-office libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Verify installed application, files and rendering
        timeout-minutes: 6
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' node scripts/verify-ubuntu-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: ${{ env.RELEASE_DIR }}/verification/*
          if-no-files-found: error
  publish:
    # A normal push only builds and verifies; release assets are published together across platforms.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current release directory
        run: node -e "const fs=require('fs'),v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_DIR=release/v'+v+'\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: ${{ env.RELEASE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-ubuntu-*
          path: ${{ env.RELEASE_DIR }}/reports
      - name: Verify exact package checksums before publishing
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto'), assert = require('assert/strict');
          const version = require('./package.json').version;
          assert(/^\d+\.\d+\.\d+$/.test(version));
          const filename = require('./scripts/artifact-names.cjs').artifactName('ubuntu', version);
          const bytes = fs.readFileSync(path.join(process.env.RELEASE_DIR, filename));
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          for (const os of ['ubuntu-22.04', 'ubuntu-24.04']) {
            const report = JSON.parse(fs.readFileSync(`${process.env.RELEASE_DIR}/reports/verification-${os}/ubuntu-verification.json`, 'utf8'));
            assert(report.passed && report.version === version && report.packageSha256 === sha256 && report.packageBytes === bytes.length && report.sandboxBypassed === false);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${version}\nRELEASE_REPORT=seal-office-${version}-ubuntu-verification.zip\n`);
          console.log(`${filename} SHA-256 ${sha256}: both installed-package checks passed`);
          NODE
      - name: Publish verified Ubuntu package and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd "$RELEASE_DIR/reports" && zip -r "../$RELEASE_REPORT" .)
          # Only these two Ubuntu assets are refreshed, after both systems pass.
          gh release upload "$RELEASE_TAG" "$RELEASE_DIR"/*.deb "$RELEASE_DIR/$RELEASE_REPORT" --repo "$GITHUB_REPOSITORY" --clobber
