name: Ubuntu desktop package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu.yml'
      - 'build/electron-ubuntu.cjs'
      - 'main/linux/**'
      - 'main/office/native*.js'
      - 'scripts/verify-ubuntu-release.cjs'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify platform integration
        run: npx vitest run --config vitest.main.config.js main/linux/platform.test.js main/fileAssociation.test.js main/windows/defaultApps.test.js main/main.test.js main/integrity.test.js
      - name: Build Ubuntu amd64 package
        # Release upload happens separately after both installed-package checks.
        run: npm run dist:ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: release/ubuntu/*.deb
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: release/ubuntu
      - name: Install package and offline conversion dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./release/ubuntu/*.deb xvfb desktop-file-utils
          desktop-file-validate /usr/share/applications/sealoffice.desktop
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' seal-office libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Verify installed application, files and rendering
        timeout-minutes: 6
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' node scripts/verify-ubuntu-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: release/ubuntu/verification/*
          if-no-files-found: error
  publish:
    needs: [build, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-deb
          path: release/ubuntu
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-ubuntu-*
          path: release/ubuntu/reports
      - name: Verify exact package checksums before publishing
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto'), assert = require('assert/strict');
          const version = require('./package.json').version;
          assert(/^\d+\.\d+\.\d+$/.test(version));
          const filename = `SealOfficeUbuntu${version}-amd64.deb`;
          const bytes = fs.readFileSync(path.join('release/ubuntu', filename));
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          for (const os of ['ubuntu-22.04', 'ubuntu-24.04']) {
            const report = JSON.parse(fs.readFileSync(`release/ubuntu/reports/verification-${os}/ubuntu-verification.json`, 'utf8'));
            assert(report.passed && report.version === version && report.packageSha256 === sha256 && report.packageBytes === bytes.length && report.sandboxBypassed === false);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${version}\nRELEASE_REPORT=SealOffice${version}-UbuntuVerification.zip\n`);
          console.log(`${filename} SHA-256 ${sha256}: both installed-package checks passed`);
          NODE
      - name: Publish verified Ubuntu package and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release/ubuntu/reports && zip -r "../$RELEASE_REPORT" .)
          gh release upload "$RELEASE_TAG" release/ubuntu/*.deb "release/ubuntu/$RELEASE_REPORT" --repo "$GITHUB_REPOSITORY"
