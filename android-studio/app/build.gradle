import java.security.KeyStore
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def releaseKeystore = providers.environmentVariable('SEAL_ANDROID_KEYSTORE').orNull
def releaseStorePassword = providers.environmentVariable('SEAL_ANDROID_STORE_PASSWORD').orNull
def releaseAlias = providers.environmentVariable('SEAL_ANDROID_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('SEAL_ANDROID_KEY_PASSWORD').orNull
def releaseCertificateSha256 = '53b13e1c76a826eb15879061e8840d9bc051156ff9ed33530339f444cd3997ad'

android {
    namespace 'com.sealoffice.mobile'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.sealoffice.mobile'
        minSdk 28
        targetSdk 36
        versionCode 20701
        versionName '2.7.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appLabel: '海豹办公']
    }

    signingConfigs {
        release {
            if (releaseKeystore && releaseStorePassword && releaseAlias && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.nativeqa'
            versionNameSuffix '-本机测试'
            manifestPlaceholders = [appLabel: '海豹办公测试']
        }
        release { signingConfig signingConfigs.release }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseKeystore || !releaseStorePassword || !releaseAlias || !releaseKeyPassword) {
            throw new GradleException('缺少旧版安卓签名配置，不能生成可覆盖安装的正式包')
        }
        try {
            def keystoreFile = file(releaseKeystore)
            if (!keystoreFile.isFile()) throw new IllegalArgumentException('签名文件不存在')
            def store = KeyStore.getInstance(keystoreFile, releaseStorePassword.toCharArray())
            def certificate = store.getCertificate(releaseAlias)
            if (certificate == null || !store.isKeyEntry(releaseAlias)) throw new IllegalArgumentException('签名别名无效')
            def fingerprint = MessageDigest.getInstance('SHA-256').digest(certificate.encoded)
                    .collect { String.format('%02x', it & 0xff) }.join('')
            if (fingerprint != releaseCertificateSha256) throw new IllegalArgumentException('签名证书与旧版不一致')
        } catch (Exception error) {
            throw new GradleException('安卓正式签名核验失败：' + error.message)
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn tasks.named('verifyReleaseSigning') }

def officeSource = rootProject.file('../mobile/static/office')
tasks.register('prepareOfficeAssets', Sync) {
    from officeSource
    into project.file('src/main/assets/apps/__UNI__B52B65B/www/static/office')
    doFirst {
        def info = new File(officeSource, 'build-info.json')
        if (!info.isFile() || !new File(officeSource, 'office.js').isFile() || !new File(officeSource, 'fonts/NotoSansSC.ttf').isFile() || !new File(officeSource, 'fonts/NotoSerifCJKsc-Regular.otf').isFile()) {
            throw new GradleException('安卓编辑器资源不完整，请先在仓库根目录运行 npm --prefix mobile run build:android')
        }
        def version = new groovy.json.JsonSlurper().parse(info)
        if (version.platform != 'android' || version.desktopVersion != '2.7.1') {
            throw new GradleException('安卓编辑器资源的平台或版本不匹配')
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareOfficeAssets') }
tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets' }
        .configureEach { dependsOn tasks.named('prepareOfficeAssets') }

dependencies {
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    // FileProvider：系统相机写入拍照结果（webkit 已间接依赖同一版本，此处显式声明）。
    implementation 'androidx.core:core:1.6.0'
    testImplementation 'junit:junit:4.13.2'
}
