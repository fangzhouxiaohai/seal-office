<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2B6CF6" />
  <meta name="color-scheme" content="light dark" />
  <style>
    @font-face{font-family:SealOfficeCJK;src:url('/fonts/NotoSansSC.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'思源黑体';src:url('/fonts/NotoSansSC.ttf') format('truetype');font-display:swap}
    @font-face{font-family:'思源宋体';src:url('/fonts/NotoSerifCJKsc-Regular.otf') format('opentype');font-display:swap}
    body{margin:0;background:#f5f7ff}
    .startup-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#f5f7ff}
    .startup-screen img{display:block;width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 14px 25px rgba(45,89,219,.14))}
    .startup-screen strong{font:600 22px/1.4 system-ui,sans-serif;letter-spacing:.08em;color:#1b2034}
    [data-seal-android-host="1"] .startup-screen{display:none}
  </style>
  <link rel="icon" type="image/png" href="./icons/icon32.png" />
  <link rel="apple-touch-icon" href="./icons/icon180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>海豹办公</title>
</head>
<body>
  <div id="root"><div class="startup-screen" role="status" aria-label="海豹办公加载中"><img src="./icons/startup-logo.png" alt="海豹办公" width="112" height="112" /><strong>海豹办公</strong></div></div>
  <script src="./compatibility.js"></script>
  <script src="./uni.webview.js"></script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
