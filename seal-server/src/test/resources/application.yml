spring:
  datasource:
    # 内存 H2 以 MySQL 兼容模式运行，WINDOW 保留字放行（schema.sql 已加反引号，双保险）
    url: jdbc:h2:mem:seal-test;MODE=MySQL;NON_KEYWORDS=WINDOW;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

seal:
  data-dir: ${java.io.tmpdir}/seal-server-test-data
  erasure-dir: ${java.io.tmpdir}/seal-server-test-erasure

logging:
  level:
    root: warn
    com.sealoffice: info
