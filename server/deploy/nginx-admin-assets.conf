# ============================================================
# 管理后台静态资源（海豹办公）
# ============================================================
# 背景：主配置 seal.xingmasoft.com.conf 里的
#   location ~ .*\.(js|css)?$        （只设 expires 12h）
#   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$（只设 expires 30d）
# 这两条正则 location 都没有设置 root。正则 location 的匹配优先级高于
# location /（前缀匹配为最长前缀，但正则优先），于是 .js/.css/.png 请求
# 会回落到 server 级 root /www/wwwroot/seal.xingmasoft.com，
# 而该目录下没有 assets/，结果 /assets/*.js 全部 404。
# 浏览器拿不到入口脚本，管理后台就表现为白屏。
#
# 修复：用 ^~ 前缀匹配（优先级高于正则）为后台资源显式指定 root，
# 直接指向 nginx 真正的后台站点目录 <siteRoot>/admin。
# 只覆盖 /assets/ 与两个固定资源，不影响 /office/、/api/ 等既有规则。
#
# 部署位置：
#   /www/server/panel/vhost/nginx/extension/seal.xingmasoft.com/10-admin-assets.conf
# 该目录由站点主配置 include，且宝塔重建站点时不会覆盖。
# ============================================================

location ^~ /assets/ {
    root /www/wwwroot/seal.xingmasoft.com/admin;
    expires 12h;
    access_log off;
    try_files $uri =404;
}

location = /favicon.svg {
    root /www/wwwroot/seal.xingmasoft.com/admin;
    expires 30d;
    access_log off;
}

location = /seal-logo.png {
    root /www/wwwroot/seal.xingmasoft.com/admin;
    expires 30d;
    access_log off;
}

# 匿名文件下载页独立于管理后台，链接的片段只在浏览器中解密。
location = /share { return 301 /share/; }
location = /share/ {
    root /www/wwwroot/seal.xingmasoft.com;
    try_files /share/index.html =404;
}
location ^~ /share/ {
    root /www/wwwroot/seal.xingmasoft.com;
    try_files $uri =404;
}
