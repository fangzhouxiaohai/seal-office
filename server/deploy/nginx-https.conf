server {
  listen 80;
  server_name seal.xingmasoft.com;
  location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/seal.xingmasoft.com; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name seal.xingmasoft.com;
  root /www/wwwroot/seal.xingmasoft.com/admin;
  ssl_certificate /www/server/panel/vhost/cert/seal.xingmasoft.com/fullchain.pem;
  ssl_certificate_key /www/server/panel/vhost/cert/seal.xingmasoft.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SEAL:10m;
  ssl_session_timeout 10m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://127.0.0.1:8096/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    client_max_body_size 33m;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~ /\. { deny all; }
  access_log /www/wwwlogs/seal.xingmasoft.com.log;
  error_log /www/wwwlogs/seal.xingmasoft.com.error.log;
}
