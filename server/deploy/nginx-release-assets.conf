# 安装包与普通业务接口分开限额，流式转发避免把数百兆文件缓存在内存。
location = /api/v1/admin/release-assets {
    proxy_pass http://127.0.0.1:8096/v1/admin/release-assets;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 1g;
    client_body_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 1800s;
}

# 下载是否允许由服务端发布状态决定，未上架和已下架附件均不可下载。
location ^~ /api/v1/release-assets/ {
    proxy_pass http://127.0.0.1:8096/v1/release-assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
