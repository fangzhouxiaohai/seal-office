# 新版后台静态资源独立前缀；旧 /assets/ 仍由原规则提供。
location ^~ /admin-assets/ {
    alias /www/wwwroot/seal.xingmasoft.com/admin/;
    try_files $uri =404;
    expires 12h;
    access_log off;
}

# 仅暴露白名单管理桥接；大文件上传、公开下载及客户端接口走既有路由。
location ^~ /seal-admin/ {
    include /www/server/nginx/conf/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /www/wwwroot/seal.xingmasoft.com/seal-admin-php/current/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/seal-admin-php/fpm.sock;
    fastcgi_cache off;
    fastcgi_request_buffering on;
    client_max_body_size 2m;
    client_body_timeout 120s;
    fastcgi_send_timeout 210s;
    fastcgi_read_timeout 210s;
}
