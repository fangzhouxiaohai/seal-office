# 此片段仅可在核对线上现有配置及后台路由前缀后，纳入对应 HTTPS 站点。
# /office/、/api/、/share/ 和管理后台资源继续由原有规则处理。
location = / {
    root /www/wwwroot/seal.xingmasoft.com/websitecurrent;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}
location ^~ /website-assets/ {
    alias /www/wwwroot/seal.xingmasoft.com/websitecurrent/;
    try_files $uri =404;
}
location = /admin { return 301 /admin/; }
location ^~ /admin/ {
    alias /www/wwwroot/seal.xingmasoft.com/admin/;
    try_files $uri $uri/ /admin/index.html;
}
