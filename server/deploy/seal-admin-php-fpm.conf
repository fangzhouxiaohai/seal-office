; 海豹办公后台专用 PHP 8.2 FPM 实例，不加载或修改其他站点的主池。
[global]
pid = /run/seal-admin-php/fpm.pid
error_log = /run/seal-admin-php/fpm.log
daemonize = no

[seal-admin]
user = www
group = www
listen = /run/seal-admin-php/fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
request_terminate_timeout = 220
clear_env = yes
catch_workers_output = yes
php_admin_value[max_execution_time] = 210
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[memory_limit] = 128M
