<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>文件下载 · 海豹办公</title>
<style>
:root{
  --brand:#2b6cf6;--brand-hover:#1e5ae0;--brand-soft:#eaf1ff;
  --bg-app:#f5f7fa;--bg-card:#fff;--text-1:#202a3d;--text-2:#667085;--text-3:#98a2b3;
  --border:#e4e7ec;--border-subtle:#f0f2f5;--danger:#e34d59;--radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg-app:#151821;--bg-card:#1c2029;--text-1:#eef1f6;--text-2:#98a2b3;
        --text-3:#6b7484;--border:#2a303b;--border-subtle:#242936;--brand-soft:#1c2a45;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5)}
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:var(--bg-app);color:var(--text-1);
  font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand svg{flex:none}
.brand strong{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand span{margin-left:auto;font-size:12px;color:var(--text-3)}
h1{margin:0 0 6px;font-size:19px;line-height:1.45;font-weight:600;word-break:break-all}
.sub{margin:0 0 20px;font-size:13px;color:var(--text-2)}
.file{
  display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:20px;
  border:1px solid var(--border-subtle);border-radius:var(--radius);background:var(--bg-app);
}
.file__icon{
  flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;
  background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;letter-spacing:.4px;
}
.file__body{min-width:0}
.file__name{margin:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file__meta{margin:2px 0 0;font-size:12px;color:var(--text-2)}
button{font:inherit;cursor:pointer;border-radius:10px;transition:background .15s,border-color .15s,color .15s}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;
  border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:600;
}
.btn-primary:hover:not(:disabled){background:var(--brand-hover)}
.btn-primary:disabled{background:var(--border);color:var(--text-3);cursor:not-allowed}
.btn-ghost{
  width:100%;min-height:42px;margin-top:10px;border:1px solid var(--border);
  background:transparent;color:var(--text-1);font-size:14px;
}
.btn-ghost:hover{background:var(--bg-app)}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--text-2)}
input[type=password]{
  width:100%;min-height:46px;padding:0 14px;margin-bottom:14px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-app);
  color:var(--text-1);font-size:16px;letter-spacing:2px;
}
input[type=password]:focus{border-color:var(--brand);outline:2px solid var(--brand-soft);outline-offset:0}
.status{margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--text-2);min-height:22px}
.status[data-tone=error]{color:var(--danger)}
.status[data-tone=ok]{color:var(--text-1)}
.spinner{
  display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;
  border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
.notice{
  margin:18px 0 0;padding:12px 14px;border-radius:10px;background:var(--bg-app);
  font-size:12px;line-height:1.7;color:var(--text-3);
}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect width="26" height="26" rx="7" fill="#2b6cf6"/>
      <path d="M8.4 8.2c1.7-1 3.6-.3 4.6 1.1 1-1.4 2.9-2.1 4.6-1.1 1.9 1.1 2.3 3.5 1.3 5.2-1.2 2.1-3.7 3.5-5.9 4.4-2.2-.9-4.7-2.3-5.9-4.4-1-1.7-.6-4.1 1.3-5.2Z" fill="#fff"/>
      <circle cx="11.1" cy="11.4" r="1" fill="#2b6cf6"/><circle cx="14.9" cy="11.4" r="1" fill="#2b6cf6"/>
    </svg>
    <strong>海豹办公</strong><span>安全分享</span>
  </div>

  <h1 id="fileName">正在读取分享信息</h1>
  <p class="sub" id="summary">请稍候，正在确认链接是否有效。</p>

  <div class="file" id="fileRow" hidden>
    <div class="file__icon" id="fileExt" aria-hidden="true">文件</div>
    <div class="file__body">
      <p class="file__name" id="fileNameRow">—</p>
      <p class="file__meta" id="fileMeta">—</p>
    </div>
  </div>

  <form id="codeForm" hidden>
    <label for="code">请输入访问码</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4–8 位数字" aria-describedby="codeHint">
    <p class="status" id="codeHint">分享者为此文件设置了访问码，输入后才能下载。</p>
    <button type="submit" class="btn-primary" id="codeSubmit">验证并下载</button>
  </form>

  <div id="downloadArea" hidden>
    <button type="button" class="btn-primary" id="download">下载文件</button>
    <button type="button" class="btn-ghost" id="retry" hidden>重试下载</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <p class="notice" id="notice">
    链接由海豹办公用户生成。文件在下载前由你的浏览器直接解密，服务器只保存密文，无法读取文件内容或文件名。
  </p>
</main>

<script src="./app.js?v=2"></script>
</body>
</html>
